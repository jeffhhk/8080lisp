- meta: {_: feature, guid: 9x2k}
  title: Add separate hello world gcc and cosmocc targets
  prompt: |
    Can you compile a hello world binary using ~/bin/cosmo/bin/cosmocc?  If not, explain what specific access you need.

    Validate with gcc in the path and provide a makefile target for me to run that directs the same thing at cosmocc.
    make clean to remove your cosmo dependencies.  Update IMPLEMENTATION_PLAN to separate cosmocc target from gcc target.
  verifications:
    - verification: make clean
      result: removed build output under o/
    - verification: make build
      result: 1 target built with gcc
    - verification: make test
      result: 1 test command succeeded and printed hello world
    - verification: make -n hello-cosmo
      result: emitted /home/jeff/bin/cosmo/bin/cosmocc -O2 -Wall -Wextra -o o/hello_cosmo.com src/hello_world.c
    - verification: make -n build
      result: emitted gcc -O2 -Wall -Wextra -o o/hello_gcc src/hello_world.c
    - verification: make -n test
      result: emitted gcc build command followed by ./o/hello_gcc
    - verification: size --format=GNU --radix=10 o/hello_gcc
      result: text=369 data=1599 bss=8 total=1976
- meta: {_: feature, guid: h7q2}
  title: Add a GAS runtime scaffold with monitor I/O shims
  prompt: |
    Read orig/lisp_8080_rawocr_2026-04-13.asm
    Assemble, fix and test a gas/gcc binary.
    Provide implementations of:
        - OUTC: output character
        - CRLF: output EOL (LF only)
        - INCH: input character
    Read docs/IMPLEMENTATION_PLAN.md.
    Use the original registers according to the map.
    Have (but do not run) an additional build target that directs the build to the toolchain in ~/bin/cosmo/bin/cosmocc to produce a cosmopolitan binary.
