    - evidence: "`tests/i8080_emu_test.c` now validates monitor-level boolean queries, including `NULL (NIL)` -> `T` and `NULL ((NIL))` -> `F`, which depend on non-head `ASSOC` lookups in the assembled-function table."
    - evidence: docs/Reference.md now restores the validated non-head `ASSOC` behavior description.
  acceptance:
    - acceptance: Reproduce the second-binding lookup failure in an automated test or otherwise disprove it.
    - acceptance: Determine whether the issue is in ASSOC recursion, EQUAL comparison, or the constructed alist shape.
    - acceptance: Validate correct non-head lookup behavior once the root cause is fixed.
  related:
