- meta: {_: bug, id: PORT-0002G, status: done, priority: high, guid: g4m7}
  title: Corrected Lisp routine labels should match the encoded entry addresses
  expected_behavior: |
    Routine labels in the corrected Lisp listing should identify the actual
    encoded entry addresses that the image uses for direct calls and routine-level
    validation.
  evidence:
    - evidence: During the PORT-0002E interpreter test work, direct execution of CONS behaved correctly only when entered at 0x0016.
    - evidence: The original image contains CALL sites to 0x0016 for CONS, while the corrected listing presentation makes CONS appear to begin at 0x0013.
    - evidence: The interpreter tests in tests/lisp_interpreter_test.c had to call the real encoded entry addresses from the assembled image rather than the apparent listing label positions.
    - evidence: The corrected listing now realigns the opening OCR-shifted block so CAR starts at 0x0009, CDR at 0x0010, and CONS at 0x0016.
    - evidence: docs/OCR_CORRECTIONS.yaml records each justified opening-block correction, and tests/lisp_interpreter_test.c now assembles the corrected listing successfully.
  acceptance:
    - acceptance: Determine whether the mismatch is a corrected-listing transcription problem, a presentation problem, or a test-assumption problem.
    - acceptance: Update the corrected listing or supporting tooling so routine labels and encoded entry addresses agree.
    - acceptance: Keep routine-level tests aligned with the resolved entry-address mapping.
  related:
    - development_log: p7r4
    - file: src/lisp_8080_corrected.asm
    - file: tests/lisp_interpreter_test.c
    - file: docs/OCR_CORRECTIONS.yaml
  notes: |
    Resolved by correcting the shifted opening block in the maintained OCR copy
    and validating the corrected listing through the emulator-backed
    interpreter tests.

- meta: {_: bug, id: PORT-0002H, status: done, priority: medium, guid: h5n8}
  title: ASSOC should return a matching non-head binding from PAIRLIS output
  expected_behavior: |
    ASSOC should return the matching binding pair even when the requested key is
    not in the first element of an association list produced by PAIRLIS.
  evidence:
    - evidence: A direct emulator probe during PORT-0002E built the alist ((T.F) (F.T)) using PAIRLIS against the original image.
    - evidence: The corrected listing now moves the recursive `XCHG` and `JMP ASSO2` bytes out of the `CALL CDR` immediate field in `ASSOC`, so the recursive step no longer jumps to `0xC3EB`.
    - evidence: "`tests/lisp_interpreter_test.c` now validates `ASSOC(F, alist) == (F.T)` alongside the head-binding case."
    - evidence: "`tests/i8080_emu_test.c` now validates monitor-level boolean queries, including `NULL (NIL)` -> `T` and `NULL ((NIL))` -> `F`, which depend on non-head `ASSOC` lookups in the assembled-function table."
    - evidence: docs/Reference.md now restores the validated non-head `ASSOC` behavior description.
  acceptance:
    - acceptance: Reproduce the second-binding lookup failure in an automated test or otherwise disprove it.
    - acceptance: Determine whether the issue is in ASSOC recursion, EQUAL comparison, or the constructed alist shape.
    - acceptance: Validate correct non-head lookup behavior once the root cause is fixed.
  related:
    - development_log: p7r4
    - file: src/lisp_8080_corrected.asm
    - file: tests/lisp_interpreter_test.c
    - file: tests/i8080_emu_test.c
    - file: docs/OCR_CORRECTIONS.yaml

